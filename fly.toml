app = "parmana"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[[services]]
internal_port = 8080
processes = ["app"]

[services.http_checks]
enabled = true
uri = "/api/status"

[[services.ports]]
port = 80
handlers = ["http"]
force_https = true

[[services.ports]]
port = 443
handlers = ["tls", "http"]